name: Build Rift Web Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev pkg-config build-essential python3
    
    - name: Remove kerberos
      run: |
        npm pkg delete optionalDependencies.kerberos 2>/dev/null || true
        sed -i '/kerberos/d' package-lock.json 2>/dev/null || true
    
    - name: Install dependencies
      run: npm install --no-optional --no-audit --no-fund
    
    - name: Build web version
      run: npx gulp vscode-reh-web-linux-x64-min
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: rift-web-build
        path: vscode-reh-web-linux-x64/
