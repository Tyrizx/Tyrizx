name: Build Rift Web Version

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    
    - name: Install dependencies (skip native modules)
      run: npm install --omit=optional --ignore-scripts --no-audit --no-fund
    
    - name: Build web version
      run: npx gulp vscode-reh-web-linux-x64-min
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: rift-web-build
        path: vscode-reh-web-linux-x64/
