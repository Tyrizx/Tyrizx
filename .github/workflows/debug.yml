name: Tyrizx - Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download OpenVSCode Server
      run: |
        set -e
        ROOT_DIR=$PWD
        NODE_PROJECT_DIR="$ROOT_DIR/app/src/main/assets/nodejs-project"

        mkdir -p "$NODE_PROJECT_DIR"

        cd "$NODE_PROJECT_DIR"
        wget -q https://github.com/gitpod-io/openvscode-server/releases/download/openvscode-server-v1.109.5/openvscode-server-v1.109.5-linux-arm64.tar.gz
        tar -xzf openvscode-server-v1.109.5-linux-arm64.tar.gz
        mv openvscode-server-v1.109.5-linux-arm64/* .
        rm -rf openvscode-server-v1.109.5-linux-arm64 openvscode-server-v1.109.5-linux-arm64.tar.gz

        # Create the main.js entry point for nodejs-mobile
        cat > main.js << 'EOF'
        const { fork } = require('child_process');
        fork('./out/server-main.js', [
          '--port', '8080',
          '--host', '127.0.0.1',
          '--without-connection-token'
        ], { stdio: 'inherit' });
        EOF

    - name: Download nodejs-mobile library
      run: |
        set -e
        ROOT_DIR=$PWD
        cd "$ROOT_DIR"

        # Download the latest nodejs-mobile Android package
        wget -q https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
        unzip -q nodejs-mobile-v18.20.4-android.zip

        # Copy libnode.so for each architecture into jniLibs
        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        mkdir -p app/src/main/jniLibs/x86
        mkdir -p app/src/main/jniLibs/x86_64

        cp nodejs-mobile-v18.20.4-android/bin/arm64-v8a/libnode.so app/src/main/jniLibs/arm64-v8a/
        cp nodejs-mobile-v18.20.4-android/bin/armeabi-v7a/libnode.so app/src/main/jniLibs/armeabi-v7a/
        cp nodejs-mobile-v18.20.4-android/bin/x86/libnode.so app/src/main/jniLibs/x86/
        cp nodejs-mobile-v18.20.4-android/bin/x86_64/libnode.so app/src/main/jniLibs/x86_64/

        # Copy headers for the JNI bridge
        mkdir -p app/libnode/include
        cp -r nodejs-mobile-v18.20.4-android/include/node app/libnode/include/

        rm -rf nodejs-mobile-v18.20.4-android.zip nodejs-mobile-v18.20.4-android

    - name: Apply Tyrizx branding
      run: |
        cat > app/src/main/assets/nodejs-project/product.json << 'EOF'
        {
          "nameShort": "Tyrizx",
          "nameLong": "Tyrizx",
          "applicationName": "tyrizx",
          "dataFolderName": ".tyrizx",
          "win32AppUserModelId": "io.tyrizx",
          "darwinBundleIdentifier": "io.tyrizx",
          "linuxIconName": "tyrizx",
          "extensionsGallery": {
            "serviceUrl": "https://open-vsx.org/vscode/gallery",
            "itemUrl": "https://open-vsx.org/vscode/item",
            "resourceUrlTemplate": "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
            "extensionUrlTemplate": "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest"
          },
          "enableTelemetry": false
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.OPTIMA_TOKEN }}

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: tyrizx-debug
        path: app/build/outputs/apk/debug/*.apk
