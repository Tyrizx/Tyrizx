name: Tyrizx - Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download OpenVSCode Server
      run: |
        set -e
        ROOT_DIR=$PWD
        NODE_PROJECT_DIR="$ROOT_DIR/app/src/main/assets/nodejs-project"

        mkdir -p "$NODE_PROJECT_DIR"

        cd "$NODE_PROJECT_DIR"
        wget -q https://github.com/gitpod-io/openvscode-server/releases/download/openvscode-server-v1.109.5/openvscode-server-v1.109.5-linux-arm64.tar.gz
        tar -xzf openvscode-server-v1.109.5-linux-arm64.tar.gz
        mv openvscode-server-v1.109.5-linux-arm64/* .
        rm -rf openvscode-server-v1.109.5-linux-arm64 openvscode-server-v1.109.5-linux-arm64.tar.gz

        cat > main.js << 'EOF'
        const { fork } = require('child_process');
        fork('./out/server-main.js', [
          '--port', '8080',
          '--host', '127.0.0.1',
          '--without-connection-token'
        ], { stdio: 'inherit' });
        EOF

    - name: Download nodejs-mobile library
      run: |
        set -e
        ROOT_DIR=$PWD
        cd "$ROOT_DIR"

        wget -q https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip

        mkdir -p nodejs-mobile-extract
        unzip -q -o nodejs-mobile-v18.20.4-android.zip -d nodejs-mobile-extract

        echo "Full extracted structure:"
        find nodejs-mobile-extract -maxdepth 4 | head -50

        mkdir -p app/src/main/jniLibs/arm64-v8a
        mkdir -p app/src/main/jniLibs/armeabi-v7a
        mkdir -p app/src/main/jniLibs/x86
        mkdir -p app/src/main/jniLibs/x86_64

        for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
          SRC=$(find nodejs-mobile-extract -path "*$ABI*" -name "libnode.so" -type f | head -n 1)
          if [ -n "$SRC" ]; then
            cp "$SRC" "app/src/main/jniLibs/$ABI/"
            echo "Copied $ABI from $SRC"
          else
            echo "WARNING: libnode.so not found for $ABI"
          fi
        done

        mkdir -p app/libnode/include
        HEADER_SRC=$(find nodejs-mobile-extract -type d -name "node" | grep "include" | head -n 1)
        if [ -n "$HEADER_SRC" ]; then
          cp -r "$HEADER_SRC" app/libnode/include/
          echo "Copied headers from $HEADER_SRC"
        else
          echo "WARNING: node headers not found"
        fi

        rm -rf nodejs-mobile-v18.20.4-android.zip nodejs-mobile-extract

    - name: Apply Tyrizx branding
      run: |
        cat > app/src/main/assets/nodejs-project/product.json << 'EOF'
        {
          "nameShort": "Tyrizx",
          "nameLong": "Tyrizx",
          "applicationName": "tyrizx",
          "dataFolderName": ".tyrizx",
          "win32AppUserModelId": "io.tyrizx",
          "darwinBundleIdentifier": "io.tyrizx",
          "linuxIconName": "tyrizx",
          "extensionsGallery": {
            "serviceUrl": "https://open-vsx.org/vscode/gallery",
            "itemUrl": "https://open-vsx.org/vscode/item",
            "resourceUrlTemplate": "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
            "extensionUrlTemplate": "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest"
          },
          "enableTelemetry": false
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.OPTIMA_TOKEN }}

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: tyrizx-debug
        path: app/build/outputs/apk/debug/*.apk
