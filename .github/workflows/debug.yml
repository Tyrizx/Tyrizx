name: Tyrizx - Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download and prepare OpenVSCode Server (Android)
      run: |
        set -e
        ROOT_DIR=$PWD
        ASSETS_DIR="$ROOT_DIR/app/src/main/assets/openvscode"

        mkdir -p "$ASSETS_DIR"

        # 1. Download OpenVSCode Server
        cd "$ASSETS_DIR"
        wget -q https://github.com/gitpod-io/openvscode-server/releases/download/openvscode-server-v1.109.5/openvscode-server-v1.109.5-linux-arm64.tar.gz
        tar -xzf openvscode-server-v1.109.5-linux-arm64.tar.gz
        mv openvscode-server-v1.109.5-linux-arm64/* .
        rm -rf openvscode-server-v1.109.5-linux-arm64 openvscode-server-v1.109.5-linux-arm64.tar.gz

        # 2. Fetch Termux package index
        cd "$ROOT_DIR"
        BASE_URL="https://packages.termux.dev/apt/termux-main"
        wget -q "$BASE_URL/dists/stable/main/binary-aarch64/Packages" -O TermuxPackages

        # Robust extraction function preserving true symlink mapping properties (-P)
        extract_and_copy_libs() {
          local PKG_NAME=$1
          local PKG_PATH=$(grep -E "^Filename: pool/main/.*${PKG_NAME}_[0-9.-]+_aarch64\.deb" TermuxPackages | head -n 1 | awk '{print $2}')
          if [ -z "$PKG_PATH" ]; then
            PKG_PATH=$(grep -E "^Filename: pool/main/.*${PKG_NAME}.*\.deb" TermuxPackages | head -n 1 | awk '{print $2}')
          fi
          if [ -z "$PKG_PATH" ]; then
            echo "WARNING: Package $PKG_NAME not found, skipping"
            return 0
          fi
          local PKG_DEB=$(basename "$PKG_PATH")
          echo "Processing dependency package: $PKG_DEB"
          wget -q "$BASE_URL/$PKG_PATH" -O "$PKG_DEB"
          mkdir -p "extract-$PKG_NAME"
          dpkg-deb -x "$PKG_DEB" "extract-$PKG_NAME/"
          # CRITICAL: Preserve structure links natively via cp -P instead of flattening via -L
          find "extract-$PKG_NAME" -name "*.so*" -exec cp -P {} "$ASSETS_DIR/" \; 2>/dev/null || true
          rm -rf "extract-$PKG_NAME" "$PKG_DEB"
        }

        # 3. Extract Node binary
        NODE_PATH=$(grep -E '^Filename: pool/main/n/nodejs-lts/nodejs-lts_' TermuxPackages | head -n 1 | awk '{print $2}')
        if [ -z "$NODE_PATH" ]; then
          NODE_PATH=$(grep -E '^Filename: pool/main/[^/]+/nodejs-lts/nodejs-lts_' TermuxPackages | head -n 1 | awk '{print $2}')
        fi
        NODE_DEB=$(basename "$NODE_PATH")
        wget -q "$BASE_URL/$NODE_PATH" -O "$NODE_DEB"
        mkdir -p node-extract
        dpkg-deb -x "$NODE_DEB" node-extract/
        cp node-extract/data/data/com.termux/files/usr/bin/node "$ASSETS_DIR/libnode.so"
        rm -rf node-extract "$NODE_DEB"

        # 4. Extract required libraries
        extract_and_copy_libs "zlib"
        extract_and_copy_libs "openssl"
        extract_and_copy_libs "libuv"
        extract_and_copy_libs "libicu"
        extract_and_copy_libs "libc\+\+"
        extract_and_copy_libs "libcrypt"
        extract_and_copy_libs "libedit"
        extract_and_copy_libs "libevent"
        extract_and_copy_libs "libnghttp2"

        # 5. Safe creation of custom fallbacks inside assets
        cd "$ASSETS_DIR"

        # Bionic Android compatibility routing map
        ln -sf libc++_shared.so libstdc++.so.6

        # Check for non-versioned base symlinks that Node expects if they were missing
        [ ! -f libz.so.1 ] && [ -f libz.so ] && ln -sf libz.so libz.so.1
        [ ! -f libcrypto.so.3 ] && [ -f libcrypto.so ] && ln -sf libcrypto.so libcrypto.so.3
        [ ! -f libssl.so.3 ] && [ -f libssl.so ] && ln -sf libssl.so libssl.so.3
        [ ! -f libuv.so.1 ] && [ -f libuv.so ] && ln -sf libuv.so libuv.so.1

        rm -f "$ROOT_DIR/TermuxPackages"
        echo "All libraries extracted and verified successfully."
        ls -la "$ASSETS_DIR"

    - name: Apply Tyrizx branding
      run: |
        cat > app/src/main/assets/openvscode/product.json << 'EOF'
        {
          "nameShort": "Tyrizx",
          "nameLong": "Tyrizx",
          "applicationName": "tyrizx",
          "dataFolderName": ".tyrizx",
          "win32AppUserModelId": "io.tyrizx",
          "darwinBundleIdentifier": "io.tyrizx",
          "linuxIconName": "tyrizx",
          "extensionsGallery": {
            "serviceUrl": "https://open-vsx.org/vscode/gallery",
            "itemUrl": "https://open-vsx.org/vscode/item",
            "resourceUrlTemplate": "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
            "extensionUrlTemplate": "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest"
          },
          "enableTelemetry": false
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: tyrizx-debug
        path: app/build/outputs/apk/debug/*.apk
