name: Tyrizx - Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download and prepare OpenVSCode Server (Android)
      run: |
        # 1. Create assets folder
        mkdir -p app/src/main/assets/openvscode
        cd app/src/main/assets/openvscode

        # 2. Download official OpenVSCode Server ARM64 tarball
        wget -q https://github.com/gitpod-io/openvscode-server/releases/download/openvscode-server-v1.109.5/openvscode-server-v1.109.5-linux-arm64.tar.gz
        tar -xzf openvscode-server-v1.109.5-linux-arm64.tar.gz
        mv openvscode-server-v1.109.5-linux-arm64/* .
        rm -rf openvscode-server-v1.109.5-linux-arm64 openvscode-server-v1.109.5-linux-arm64.tar.gz

        # 3. Download Termux Node binary (Android Bionic)
        wget -q https://packages.termux.dev/apt/termux-main/pool/main/nodejs/nodejs-lts_24.18.0_aarch64.deb
        ar x nodejs-lts_24.18.0_aarch64.deb data.tar.xz
        tar -xf data.tar.xz --strip-components=3 ./data/data/com.termux/files/usr/bin/node
        chmod +x node
        rm -f nodejs-lts_24.18.0_aarch64.deb data.tar.xz

        # 4. Download libc++_shared.so (Android Bionic)
        wget -q https://packages.termux.dev/apt/termux-main/pool/main/libc%2b%2b/libc%2b%2b_29.0_aarch64.deb
        ar x libc%2b%2b_29.0_aarch64.deb data.tar.xz
        tar -xf data.tar.xz --strip-components=3 ./data/data/com.termux/files/usr/lib/libc++_shared.so
        rm -f libc%2b%2b_29.0_aarch64.deb data.tar.xz

        # 5. Create symlink so Node finds libstdc++.so.6
        ln -sf libc++_shared.so libstdc++.so.6

    - name: Apply Tyrizx branding
      run: |
        cat > app/src/main/assets/openvscode/product.json << 'EOF'
        {
          "nameShort": "Tyrizx",
          "nameLong": "Tyrizx",
          "applicationName": "tyrizx",
          "dataFolderName": ".tyrizx",
          "win32AppUserModelId": "io.tyrizx",
          "darwinBundleIdentifier": "io.tyrizx",
          "linuxIconName": "tyrizx",
          "extensionsGallery": {
            "serviceUrl": "https://open-vsx.org/vscode/gallery",
            "itemUrl": "https://open-vsx.org/vscode/item",
            "resourceUrlTemplate": "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
            "extensionUrlTemplate": "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest"
          },
          "enableTelemetry": false
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: tyrizx-debug
        path: app/build/outputs/apk/debug/*.apk
