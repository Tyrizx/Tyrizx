name: Tyrizx - Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Download and prepare code-server
      run: |
        mkdir -p app/src/main/assets/code-server
        cd app/src/main/assets/code-server
        wget -q https://github.com/coder/code-server/releases/download/v4.135.0/code-server-4.135.0-linux-arm64.tar.gz
        tar -xzf code-server-4.135.0-linux-arm64.tar.gz
        mv code-server-4.135.0-linux-arm64/* .
        rm -rf code-server-4.135.0-linux-arm64 code-server-4.135.0-linux-arm64.tar.gz

    - name: Apply Tyrizx branding
      run: |
        cat > app/src/main/assets/code-server/product.json << 'EOF'
        {
          "nameShort": "Tyrizx",
          "nameLong": "Tyrizx",
          "applicationName": "tyrizx",
          "dataFolderName": ".tyrizx",
          "win32AppUserModelId": "io.tyrizx",
          "darwinBundleIdentifier": "io.tyrizx",
          "linuxIconName": "tyrizx",
          "extensionsGallery": {
            "serviceUrl": "https://open-vsx.org/vscode/gallery",
            "itemUrl": "https://open-vsx.org/vscode/item",
            "resourceUrlTemplate": "https://open-vsx.org/vscode/unpkg/{publisher}/{name}/{version}/{path}",
            "extensionUrlTemplate": "https://open-vsx.org/vscode/gallery/{publisher}/{name}/latest"
          },
          "enableTelemetry": false
        }
        EOF

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: tyrizx-debug
        path: app/build/outputs/apk/debug/*.apk
